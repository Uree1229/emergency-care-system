# Runs the "core" suite (server, voice, team runtime, data and UI tests) on every PR
# to main and every push to main. Research verification stays on the shared PC;
# see docs/TESTING.md.
name: core-tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Team runtime and allocation baseline tests refuse any other runtime
      # (config/server_allocation_baseline_20261030.json: Python 3.12.14, SQLite 3.53.1).
      # The shared PC runs python-build-standalone 20260825; use the Linux build of the same release.
      - name: Pinned Python runtime
        env:
          PBS_URL: https://github.com/astral-sh/python-build-standalone/releases/download/20260825/cpython-3.12.14%2B20260825-x86_64-unknown-linux-gnu-install_only.tar.gz
          PBS_SHA256: cbdd2f0cf02f941bc5c81e546f377275e322733abffe805ac29d2b7e8a58f7e3
        run: |
          curl -fsSL -o "$RUNNER_TEMP/python.tar.gz" "$PBS_URL"
          echo "$PBS_SHA256  $RUNNER_TEMP/python.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/python.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/python/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install server dependencies
        run: python3 -m pip install -r requirements/requirements-server.txt -r requirements/requirements-intake-test.txt
      - name: Core suite
        run: python3 scripts/test_suites.py core
