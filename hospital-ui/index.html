<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>병원용 웹 · 수용 문의</title>
<style>
  :root {
    --ink: #1B2430; --muted: #5B6573; --line: #D5D9E0; --bg: #F4F5F7; --card: #FFFFFF;
    --blue: #1F4FA8; --blue-bg: #E8EEF9; --red: #B42318; --red-bg: #FDECEA;
    --orange: #9A3E0B; --orange-bg: #FFF1E3; --orange-line: #E8833A; --gray-bg: #E9ECF1;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; font-size: 15px; }
  button, input, select { font: inherit; }
  button { cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

  header { background: var(--ink); color: #E6E9EE; padding: 14px 24px; display: flex; gap: 18px;
           align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0 12px 0 0; color: #fff; }
  header label { display: flex; gap: 6px; align-items: center; font-size: 14px; color: #C9D0DA; }
  header input, header select { height: 36px; border: 1px solid #3A4656; border-radius: 6px;
                                background: #2C3747; color: #fff; padding: 0 8px; }
  #server { width: 190px; } #handler { width: 110px; }
  #conn { margin-left: auto; font-size: 13px; color: #A9B1BD; }
  #conn.bad { color: #FFB27A; font-weight: 700; }

  main { display: flex; gap: 20px; padding: 20px 24px; align-items: flex-start; }
  #listCol { width: 420px; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; }
  #detailCol { flex: 1; min-width: 0; }
  h2 { font-size: 17px; margin: 4px 0 2px; display: flex; gap: 8px; align-items: center; }
  .count { background: var(--orange-line); color: var(--ink); font-size: 13px; border-radius: 10px; padding: 1px 8px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
          display: flex; flex-direction: column; gap: 6px; text-align: left; width: 100%; color: inherit; }
  .card.selected { border: 2px solid var(--blue); padding: 13px 15px; }
  .card.overdue { background: #FFF8F1; }
  .card .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .card .title { font-size: 16px; font-weight: 700; }
  .card .meta { display: flex; gap: 12px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  .tag { font-size: 12px; font-weight: 700; border-radius: 6px; padding: 2px 8px; white-space: nowrap; }
  .t-high { color: var(--red); background: var(--red-bg); }
  .t-mid { color: var(--orange); background: var(--orange-bg); }
  .t-gray { color: var(--ink); background: var(--gray-bg); }
  .t-blue { color: var(--blue); background: var(--blue-bg); }
  .t-new { color: #fff; background: var(--blue); }
  .empty { color: var(--muted); padding: 18px; background: var(--card); border: 1px dashed var(--line); border-radius: 12px; }

  .recent { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 6px 14px; }
  .recent div { display: flex; justify-content: space-between; gap: 8px; padding: 8px 0; border-bottom: 1px solid #EEF0F3; font-size: 14px; }
  .recent div:last-child { border-bottom: 0; }

  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  .panel-head { padding: 18px 22px; border-bottom: 1px solid #E4E7EC; display: flex; justify-content: space-between; gap: 16px; }
  .panel-head h3 { margin: 4px 0 0; font-size: 21px; }
  .sub { font-size: 13px; color: var(--muted); }
  .grid { padding: 18px 22px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 24px; }
  .field .k { font-size: 13px; color: var(--muted); margin-bottom: 3px; }
  .field .v { font-size: 15px; }
  .danger { grid-column: span 2; background: var(--red-bg); color: var(--red); border-radius: 8px; padding: 10px 14px; font-weight: 700; }
  .qa { grid-column: span 2; background: #F7F8FA; border-radius: 8px; padding: 12px 14px; font-size: 14px; line-height: 1.6; }

  .actions { padding: 16px 22px 20px; border-top: 1px solid #E4E7EC; display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .btn { height: 52px; border-radius: 10px; font-size: 16px; font-weight: 700; padding: 0 20px; }
  .btn-accept { flex: 1; border: 0; background: var(--blue); color: #fff; font-size: 18px; }
  .btn-check { border: 1px solid var(--blue); background: #fff; color: var(--blue); }
  .btn-decline { border: 1px solid var(--red); background: #fff; color: var(--red); }
  .chip { height: 38px; padding: 0 14px; border: 1px solid var(--line); border-radius: 19px; background: #fff; }
  .chip.on { border: 2px solid var(--red); color: var(--red); font-weight: 700; }
  .q-input { flex: 1; min-width: 200px; height: 40px; border: 1px solid #C3C9D2; border-radius: 8px; padding: 0 10px; }
  .btn-small { height: 40px; padding: 0 14px; border: 1px solid #C3C9D2; border-radius: 8px; background: #fff; }
  .note { font-size: 13px; color: var(--muted); }

  /* 우리 병원 자원: 헤더 밑 가로 한 줄 */
  .resbar { background: var(--card); border-bottom: 1px solid var(--line); padding: 10px 24px; display: flex; gap: 10px 28px; align-items: center; flex-wrap: wrap; }
  .resbar-title { font-size: 13px; font-weight: 700; color: var(--muted); }
  .res-item { display: flex; align-items: baseline; gap: 6px; white-space: nowrap; }
  .res-item .k { font-size: 14px; }
  .res-item .v { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .res-item .v small { font-size: 13px; font-weight: 400; color: var(--muted); }
  .res-item .d { font-size: 12px; color: var(--muted); }
  .res-item.zero .v { color: var(--orange); }
  .res-item.over .v { color: var(--red); }
  button.res-item { border: 1px solid transparent; background: none; padding: 4px 8px; margin: -4px -8px; border-radius: 8px; color: inherit; text-align: left; }
  button.res-item:hover { border-color: var(--line); background: #F7F8FA; }
  button.res-item.selected { border-color: var(--blue); background: var(--blue-bg); }
  .restr-chip { margin-left: auto; white-space: nowrap; max-width: 320px; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: #fff;
                border-radius: 8px; padding: 6px 12px; font-size: 14px; color: var(--ink); }
  .restr-chip.on { border-color: var(--red); background: var(--red-bg); color: var(--red); font-weight: 700; }
  .restr-chip.recheck { border-color: var(--orange-line); background: var(--orange-bg); color: var(--orange); font-weight: 700; }
  .warnbox { grid-column: span 2; background: var(--orange-bg); color: var(--orange); border-radius: 8px; padding: 10px 14px; line-height: 1.6; }
  .warnbox.red { background: var(--red-bg); color: var(--red); }
  .warnbox button { margin-left: 8px; height: 32px; padding: 0 10px; border: 1px solid currentColor; border-radius: 6px; background: #fff; color: inherit; font-weight: 700; }
  .rlist { padding: 4px 22px 0; display: flex; flex-direction: column; }
  .rrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #EEF0F3; flex-wrap: wrap; }
  .rrow:last-child { border-bottom: 0; }
  .res-item.dummy .k::after { content: ' (가상)'; font-size: 12px; color: var(--muted); }

  /* 시연 메뉴 (헤더 오른쪽) */
  .demo-menu { position: relative; }
  .demo-menu summary { list-style: none; cursor: pointer; height: 36px; display: flex; align-items: center; padding: 0 12px;
                       border: 1px solid #3A4656; border-radius: 6px; font-size: 14px; color: #C9D0DA; }
  .demo-menu summary::-webkit-details-marker { display: none; }
  .demo-pop { position: absolute; right: 0; top: 42px; z-index: 10; width: 240px; background: var(--card); color: var(--ink);
              border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px;
              box-shadow: 0 6px 20px rgba(27, 36, 48, .18); }
  .demo-pop button { height: 40px; border: 1px solid var(--blue); border-radius: 8px; background: #fff; color: var(--blue); font-weight: 700; }

  /* 최근 처리 (기본 접힘) */
  .recent-wrap summary { cursor: pointer; font-size: 17px; font-weight: 700; margin: 10px 0 8px; display: flex; gap: 8px; align-items: center; }
  .count.gray { background: var(--gray-bg); }
  .recent-wrap summary { list-style: none; }
  .recent-wrap summary::-webkit-details-marker { display: none; }
  .recent-wrap summary::before { content: '▸'; font-size: 13px; color: var(--muted); }
  .recent-wrap[open] summary::before { content: '▾'; }

  /* 도착 예정 · 영향 환자 · 직접 내원 */
  .card.short { border-color: var(--red); background: #FFF6F5; }
  .card.short.selected { border: 2px solid var(--red); }
  .shortbox { grid-column: span 2; background: var(--red-bg); color: var(--red); border-radius: 8px; padding: 10px 14px; line-height: 1.6; }
  .shortbox b { font-weight: 700; }
  .guide { grid-column: span 2; background: #F7F8FA; border-radius: 8px; padding: 10px 14px; font-size: 14px; line-height: 1.6; color: var(--muted); }
  .adjbox { grid-column: span 2; background: var(--orange-bg); color: var(--orange); border-radius: 8px; padding: 10px 14px; font-weight: 700; }
  .btn-keep { flex: 1; border: 0; background: var(--blue); color: #fff; }
  .btn-adjust { border: 1px solid var(--orange-line); background: #fff; color: var(--orange); }
  .btn-arrive { border: 1px solid var(--blue); background: #fff; color: var(--blue); }
  .btn-sub { height: 40px; padding: 0 14px; border: 1px solid #C3C9D2; border-radius: 8px; background: #fff; color: var(--muted); }
  .chip.on-o { border: 2px solid var(--orange-line); color: var(--orange); font-weight: 700; }
  .ext-form { padding: 18px 22px; display: flex; flex-direction: column; gap: 14px; }
  .ext-row { display: flex; align-items: center; gap: 12px; }
  .ext-row label { width: 90px; font-weight: 700; }
  .stepper { display: flex; align-items: center; gap: 6px; }
  .stepper button { width: 38px; height: 38px; border: 1px solid #C3C9D2; border-radius: 8px; background: #fff; font-size: 18px; }
  .stepper output { min-width: 28px; text-align: center; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }

  #notice { min-height: 22px; margin: 0 0 10px; font-weight: 700; }
  #notice.err { color: var(--red); } #notice.ok { color: var(--blue); }
</style>
</head>
<body>
<header>
  <h1>병원용 웹 · 수용 문의</h1>
  <label>병원 <select id="hospital" aria-label="병원 선택"></select></label>
  <label>담당자 <input id="handler" placeholder="이름" aria-label="담당자 이름"></label>
  <label>서버 <input id="server" aria-label="서버 주소"></label>
  <span id="conn" role="status">연결 확인 중…</span>
  <details class="demo-menu">
    <summary>시연 ▾</summary>
    <div class="demo-pop">
      <span class="note">발표 시연용 가상 데이터를 만듭니다.</span>
      <button type="button" id="demoBtn">+ 새 문의 발생</button>
      <button type="button" id="demoTransportBtn">+ 이송 중 환자 만들기</button>
    </div>
  </details>
</header>
<div id="resourceBar" class="resbar" aria-label="우리 병원 자원"><span class="resbar-title">우리 병원 자원</span><span class="note">불러오는 중…</span></div>

<main>
  <section id="listCol" aria-label="문의 목록">
    <h2>대기 중인 문의 <span class="count" id="openCount">0</span></h2>
    <div id="openList"></div>
    <h2 style="margin-top:10px; justify-content:space-between">
      <span style="display:flex;gap:8px;align-items:center">도착 예정 <span class="count" id="incomingCount">0</span></span>
      <button type="button" class="btn-small" id="externalBtn">+ 직접 내원 등록</button>
    </h2>
    <div id="incomingList"></div>
    <details id="recentWrap" class="recent-wrap">
      <summary>최근 처리 <span class="count gray" id="recentCount">0</span></summary>
      <div id="recentList"></div>
    </details>
  </section>

  <section id="detailCol" aria-label="문의 상세">
    <div id="notice" role="status" aria-live="polite"></div>
    <div id="detail"><div class="empty">왼쪽에서 문의를 선택하세요.</div></div>
  </section>
</main>

<script>
// ---------------------------------------------------------------- 설정
const POLL_MS = 3000;                          // 2~3초마다 조회 (API.md 공통 규칙)
const DECLINE_REASONS = ['인력', '장비', '병상', '진료 불가', '기타'];
const params = new URLSearchParams(location.search);

const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

let serverBase = params.get('server') || store.get('serverBase', 'http://127.0.0.1:8000');
let hid = params.get('hid') || store.get('hid', 'H07');
let data = { open: [], recent: [] };
let fetchedAt = Date.now();
let selectedId = null;
let view = 'inquiry';            // 오른쪽 상세에 보여줄 것: inquiry(문의) | patient(도착 예정 환자) | external(직접 내원 등록)
let selectedPid = null;          // 선택한 도착 예정 환자 ID
let incomingData = { incoming: [], affected: [] };
let adjustReason = null;         // 조정 필요 사유 (선택식)
const ADJUST_REASONS = ['병상 부족', '전문의 부재', '장비', '기타'];
const ext = { ed_bed: 1, special_team: 0 };   // 직접 내원 등록 입력값
let selectedRtype = null;        // 수정 중인 자원 종류 (ed_bed / special_team)
let draftOccupied = null;        // 저장 전 '치료 중' 입력값
const RESTRICT_REASONS = ['병상 포화', '전문의 부재', '장비 고장', '기타'];
const RESTRICT_DURATIONS = [['30분', 1800], ['1시간', 3600], ['2시간', 7200], ['미정', null]];
const rform = { scope: 'all', reason: null, dur: 3600 };   // 수용 제한 등록 입력값
let declineReason = null;
let busy = false;
const seen = new Set();          // 이미 본 문의 id (새 문의 표시용)
const newUntil = new Map();      // id -> 새 문의 표시 종료 시각
let firstLoad = true;
let lastSig = '';

$('server').value = serverBase;
$('handler').value = store.get('handler', '');

// ---------------------------------------------------------------- 표시용 변환
const STATE = {
  PENDING: ['신규', 't-blue'], CHECKING: ['확인 중', 't-gray'], ACCEPTED: ['수용함', 't-blue'],
  DECLINED: ['불가', 't-high'], EXPIRED: ['수용 만료', 't-gray'], CANCELLED: ['환자 측 종료', 't-gray'],
  CONFIRMED: ['목적지 확정', 't-blue'],
};
const SOURCE = { self: '자기신고', expert: '전문가 확인', unknown: '미확인' };
const ROLE = { self: '본인', guardian: '보호자', transporter: '구급대원' };
const RESOURCE = { ed_bed: '응급병상', special_team: '전문팀' };

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function kst(sec) {
  if (!sec) return '-';
  return new Date(sec * 1000).toLocaleTimeString('ko-KR', { timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit' });
}
function elapsed(q) {
  const s = q.elapsed_seconds + Math.floor((Date.now() - fetchedAt) / 1000);
  const m = Math.floor(s / 60);
  return m > 0 ? `${m}분 ${s % 60}초` : `${s}초`;
}
function severityTag(p) {
  if (p.priority_source === 'unknown') return ['중증도 미확인', 't-gray'];
  if (p.effective_priority >= 4) return ['긴급', 't-high'];
  if (p.effective_priority >= 3) return ['중증', 't-high'];
  if (p.effective_priority >= 2) return ['중등증', 't-mid'];
  return ['경증', 't-gray'];
}
function stateLabel(q) {
  if (q.state === 'CHECKING' && q.question && !q.answer) return ['답변 대기', 't-gray'];
  if (q.state === 'CHECKING' && q.answer) return ['답변 도착', 't-blue'];
  return STATE[q.state] || [q.state, 't-gray'];
}
function demands(p) {
  return Object.entries(p.resource_demands || {}).map(([k, n]) => `${RESOURCE[k] || k} ${n}`).join(' · ') || '-';
}

// ---------------------------------------------------------------- 서버 통신
async function api(path, opts = {}) {
  const res = await fetch(serverBase + path, {
    ...opts, headers: { 'Content-Type': 'application/json' },
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error(body.message || `오류 ${res.status}`); e.body = body; e.status = res.status; throw e; }
  return body;
}

async function loadHospitals() {
  try {
    const list = await api('/api/hospitals');
    $('hospital').innerHTML = list.map((h) =>
      `<option value="${esc(h.id)}">${esc(h.id)} · ${esc(h.name)}</option>`).join('');
    if (!list.some((h) => h.id === hid) && list.length) hid = list[0].id;
    $('hospital').value = hid;
  } catch {
    $('hospital').innerHTML = `<option value="${esc(hid)}">${esc(hid)}</option>`;
  }
}

async function poll() {
  if (busy) return;
  try {
    // 문의 목록과 도착 예정 목록을 같이 받아옴
    const [next, inc] = await Promise.all([
      api(`/api/hospitals/${encodeURIComponent(hid)}/inquiries`),
      api(`/api/hospitals/${encodeURIComponent(hid)}/incoming`),
    ]);
    // 시간 말고 바뀐 게 없으면 다시 그리지 않음 (버튼 클릭이 끊기지 않도록)
    const sig = JSON.stringify([next, inc], (k, v) => (k === 'elapsed_seconds' || k === 'eta_remaining_seconds' ? undefined : v));
    const changed = sig !== lastSig; lastSig = sig;
    data = next; incomingData = inc; fetchedAt = Date.now();
    for (const q of data.open) {
      if (!seen.has(q.id) && !firstLoad) newUntil.set(q.id, Date.now() + 15000);
      seen.add(q.id);
    }
    firstLoad = false;
    $('conn').textContent = '마지막 갱신 ' + new Date().toLocaleTimeString('ko-KR') + ' · 3초마다 자동 갱신';
    $('conn').className = '';
    if (changed) render();
    loadResources();
  } catch (e) {
    $('conn').textContent = e.status ? e.message : '서버에 연결할 수 없습니다. 서버가 켜져 있는지 확인하세요.';
    $('conn').className = 'bad';
  }
}

// ---------------------------------------------------------------- 피드백 1: 우리 병원 자원
// 응급병상·전문팀은 서버 값(GET /api/hospitals/{hid}), 나머지는 아직 데이터가 없어 가상 값
const DUMMY_RESOURCES = [['수술 가능 의사', '2명'], ['CT', '사용 가능']];
let resSig = '';

async function loadResources() {
  try {
    const h = await api(`/api/hospitals/${encodeURIComponent(hid)}`);
    hospitalInfo = h;
    const rows = h.resources.map((r) => {
      const cls = r.free < 0 ? 'over' : r.free === 0 ? 'zero' : '';
      const detail = `치료 중 ${r.occupied} · 도착 예정 ${r.expected}${r.stale ? ' · 오래된 정보' : ''}`;
      const sel = view === 'resource' && selectedRtype === r.resource_type ? 'selected' : '';
      return `<button type="button" class="res-item ${cls} ${sel}" data-rtype="${esc(r.resource_type)}" title="눌러서 치료 중 수 수정"><span class="k">${esc(RESOURCE[r.resource_type] || r.resource_type)}</span>
        <span class="v">${r.free < 0 ? '초과 ' + (-r.free) : r.free}<small> / ${r.capacity} 남음</small></span>
        <span class="d">(${esc(detail)})</span></button>`;
    });
    const dummy = DUMMY_RESOURCES.map(([k, v]) =>
      `<div class="res-item dummy"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`);
    const rs = h.restrictions || [];
    const act = rs.filter((r) => r.status === 'active'), rc = rs.filter((r) => r.status === 'recheck');
    const rcls = rc.length ? 'recheck' : act.length ? 'on' : '';
    const rtext = rc.length ? `제한 종료 예정 지남 · 재확인 필요 ${rc.length}건`
      : act.length ? `수용 제한 중 · ${act.map((r) => scopeLabel(r.scope)).join(', ')}` : '수용 제한 없음 · 관리';
    const rtitle = rs.map((r) => `${scopeLabel(r.scope)}: ${r.reason}`).join('\n') || '수용 제한 등록·해제';
    const chip = `<button type="button" class="restr-chip ${rcls}" id="restrBtn" title="${esc(rtitle)}">${esc(rtext)}</button>`;
    const html = '<span class="resbar-title">우리 병원 자원</span>' + [...rows, ...dummy].join('') + chip;
    if (html !== resSig) {
      $('resourceBar').innerHTML = html; resSig = html;
      if ((view === 'resource' || view === 'restrict' || view === 'inquiry') && !busy) renderDetail();   // 수정 화면이 열려 있으면 최신 값으로 다시 그림 (입력 중인 값은 유지)
    }   // 바뀐 게 있을 때만 다시 그림
  } catch {
    $('resourceBar').innerHTML = '<span class="resbar-title">우리 병원 자원</span><span class="note">자원 정보를 불러오지 못했습니다.</span>';
    resSig = '';
  }
}

async function createDemoInquiry() {
  const btn = $('demoBtn');
  btn.disabled = true;
  try {
    // 이 병원이 진료할 수 있는 사례만 골라서 무작위로 하나 (없으면 응급의학 사례)
    const caps = new Set(hospitalInfo?.capabilities || []);
    const fit = DEMO_CASES.filter((c) => c.required_capabilities.every((x) => caps.has(x)));
    const pick = (fit.length ? fit : DEMO_CASES.slice(-1))[Math.floor(Math.random() * (fit.length || 1))];
    const pid = 'SIM-' + Date.now().toString(36).toUpperCase();
    await api('/api/patients', { method: 'POST', body: JSON.stringify({
      id: pid, reporter_role: 'transporter', consent: true, contact: '010-0000-0000',
      age: pick.age, symptoms: pick.symptoms, onset_at: Math.floor(Date.now() / 1000) - 1200,
      required_capabilities: pick.required_capabilities, resource_demands: pick.resource_demands,
      danger_signs: pick.danger_signs, priority: pick.priority, priority_source: 'expert',
      lat: hospitalInfo?.lat ?? null, lon: hospitalInfo?.lon ?? null,
    }) });
    await api(`/api/patients/${pid}/inquiries`, { method: 'POST', body: JSON.stringify({ hospital_ids: [hid] }) });
    notice(`새 문의가 들어왔습니다: ${pick.age}세 · ${pick.symptoms}`, false);
    lastSig = '';

    notice('새 문의를 만들지 못했습니다: ' + e.message, true);

async function respond(action, extra = {}) {
  const q = current();
  if (!q) return;
  const handler = $('handler').value.trim();
  if (!handler) { notice('담당자 이름을 먼저 입력하세요.', true); $('handler').focus(); return; }
  busy = true; render();
  try {
    const body = { action, handled_by: handler, ...extra };
    if (action === 'accept' || action === 'decline') body.expected_version = q.version;
    const r = await api(`/api/inquiries/${q.id}/respond`, { method: 'POST', body: JSON.stringify(body) });
    const done = { accept: '수용 가능으로 응답했습니다.', decline: `수용 불가(${extra.reason})로 응답했습니다.`,
                   checking: '확인 중으로 회신했습니다.', question: '추가 질문을 보냈습니다.' }[action];
    notice(r.duplicate ? '이미 같은 응답이 반영되어 있습니다.' : done + (r.warning ? ` (주의: ${r.warning})` : ''), false);
    declineReason = null;
  } catch (e) {
    let msg = e.message;
    if (e.body?.error === 'CONFLICT') msg = '다른 담당자가 먼저 처리했습니다. 목록을 새로 불러왔습니다.';
    if (e.body?.shortfalls?.length) {
      msg += ' 부족: ' + e.body.shortfalls.map((s) => `${RESOURCE[s.resource_type] || s.resource_type}`).join(', ');
    }
    notice(msg, true);
  } finally {
    busy = false;
    lastSig = '';
    await poll();
  }
}

function shortfallOf(pid) {
  return incomingData.affected.find((a) => a.patient.id === pid) || null;

function etaLeft(p) {
  if (p.eta_remaining_seconds == null) return null;
  return Math.max(0, p.eta_remaining_seconds - Math.floor((Date.now() - fetchedAt) / 1000));

    <div class="panel-head"><div><div class="sub">시스템을 거치지 않고 들어온 환자</div><h3>직접 내원 등록</h3></div></div>
    <div class="ext-form">
      <div class="note">직접 방문하거나 다른 경로로 들어온 환자가 쓰는 자원을 입력합니다. 등록하면 바로 '치료 중'에 반영되고, 자리가 모자라게 된 도착 예정 환자가 표시됩니다.</div>
      ${step('ed_bed', '응급병상')}
      ${step('special_team', '전문팀')}
      <div class="ext-row"><label for="extNote">메모</label>
        <input class="q-input" id="extNote" placeholder="예: 심정지 환자 직접 내원"></div>
      <div class="row"><button type="button" class="btn btn-keep" id="extSubmit" ${dis || (ext.ed_bed + ext.special_team ? '' : 'disabled')}>등록하고 영향 확인</button></div>
      <div class="note">등록한 건을 나중에 해제하는 기능은 아직 서버에 없습니다. 퇴실 시 자원은 자원 수정으로 반영해야 합니다.</div>
    </div></div>`;
  const note = $('extNote');
  if (note && prevText) note.value = prevText;
  if (note && hadFocus) note.focus();
}

// ---------------------------------------------------------------- 수용 제한 관리
function scopeLabel(scope) { return scope === 'all' ? '기관 전체' : scope; }
function remainText(r) {
  if (!r.ends_at) return '종료 예정 미정';
  const left = r.ends_at - Math.floor(Date.now() / 1000);
  return left > 0 ? `${kst(r.ends_at)} 종료 예정 (${Math.ceil(left / 60)}분 남음)` : `${kst(r.ends_at)} 종료 예정이 지남`;
}

// 수용 가능을 누르기 전에 서버가 막을 이유를 미리 계산 (서버 규칙과 같게: 제한 중이면 막고, 남은 자리가 모자라면 막음)
function acceptBlock(p) {
  if (!hospitalInfo) return null;
  const caps = new Set(p.required_capabilities || []);
  const r = (hospitalInfo.restrictions || []).find((x) => x.status === 'active' && (x.scope === 'all' || caps.has(x.scope)));
  if (r) return { kind: 'restrict', text: `수용 제한 중입니다: ${scopeLabel(r.scope)} · ${r.reason}. 제한을 해제해야 수용할 수 있습니다.` };
  const short = Object.entries(p.resource_demands || {}).map(([k, need]) => {
    const res = (hospitalInfo.resources || []).find((x) => x.resource_type === k);
    return res && res.free !== null && res.free < need ? `${RESOURCE[k] || k} 남은 자리 ${Math.max(0, res.free)} (필요 ${need})` : null;
  }).filter(Boolean);
  if (short.length) return { kind: 'resource', text: `자리가 부족합니다: ${short.join(', ')}. 자원을 갱신하거나 수용 불가로 응답하세요.`, rtype: Object.keys(p.resource_demands || {})[0] };
  return null;
}

function renderRestrictions() {
  const dis = busy ? 'disabled' : '';
  const rs = hospitalInfo?.restrictions || [];
  const scopes = ['all', ...(hospitalInfo?.capabilities || [])];
  const prev = $('rNote'); const prevText = prev ? prev.value : ''; const hadFocus = document.activeElement === prev;
  const list = rs.length ? rs.map((r) => `<div class="rrow">
      <div><b>${esc(scopeLabel(r.scope))}</b> · ${esc(r.reason)}
        <div class="note">${esc(kst(r.starts_at))} 시작 · ${esc(remainText(r))}</div></div>
      <div class="row">
        ${r.status === 'recheck' ? '<span class="tag t-mid">재확인 필요</span>' : r.status === 'active' ? '<span class="tag t-high">제한 중</span>' : '<span class="tag t-gray">시작 전</span>'}
        ${r.status === 'recheck' ? `<button type="button" class="btn-small" data-rext="${r.id}" ${dis}>1시간 연장</button>` : ''}
        <button type="button" class="btn-small" data-rclear="${r.id}" ${dis}>해제</button>
      </div></div>`).join('') : '<div class="note" style="padding:12px 0">등록된 수용 제한이 없습니다.</div>';
  $('detail').innerHTML = `<div class="panel">
    <div class="panel-head"><div><div class="sub">새 환자를 받을 수 없을 때 등록</div><h3>수용 제한 관리</h3></div></div>
    <div class="rlist">${list}</div>
    <div class="ext-form" style="border-top:1px solid #E4E7EC">
      <div class="row"><span class="note" style="width:90px">범위</span>
        ${scopes.map((sc) => `<button type="button" class="chip ${rform.scope === sc ? 'on' : ''}" data-rscope="${esc(sc)}" ${dis}>${esc(scopeLabel(sc))}</button>`).join('')}</div>
      <div class="row"><span class="note" style="width:90px">사유</span>
        ${RESTRICT_REASONS.map((x) => `<button type="button" class="chip ${rform.reason === x ? 'on' : ''}" data-rreason="${esc(x)}" ${dis}>${esc(x)}</button>`).join('')}</div>
      <div class="row"><span class="note" style="width:90px">종료 예정</span>
        ${RESTRICT_DURATIONS.map(([l, sec]) => `<button type="button" class="chip ${rform.dur === sec ? 'on' : ''}" data-rdur="${sec ?? ''}" ${dis}>${esc(l)}</button>`).join('')}</div>
      <div class="row"><span class="note" style="width:90px">메모</span>
        <input class="q-input" id="rNote" placeholder="선택 (예: CT 점검 중)"></div>
      <div class="row"><button type="button" class="btn btn-decline" id="rSubmit" ${dis || (rform.reason ? '' : 'disabled')}>제한 등록</button></div>
      <div class="note">제한 중에는 이 범위가 필요한 환자의 후보 목록에서 빠지고 수용 응답이 막힙니다. 종료 예정 시각이 지나도 자동으로 풀리지 않고 '재확인 필요'로 표시됩니다.</div>
    </div></div>`;
  const note = $('rNote');
  if (note && prevText) note.value = prevText;
  if (note && hadFocus) note.focus();
}

async function restrictCall(path, opts, okMsg) {
  busy = true; renderDetail();
  try { await api(path, opts); notice(okMsg, false); return true; }
  catch (e) { notice(e.message, true); return false; }
  finally { busy = false; resSig = ''; await loadResources(); lastSig = ''; await poll(); renderDetail(); }
}
async function addRestriction(scope, reason, dur) {
  const handler = needHandler(); if (!handler) return false;
  const ends_at = dur ? Math.floor(Date.now() / 1000) + dur : null;
  return restrictCall(`/api/hospitals/${encodeURIComponent(hid)}/restrictions`,
    { method: 'POST', body: JSON.stringify({ scope, reason, ends_at, handled_by: handler }) },
    `수용 제한을 등록했습니다: ${scopeLabel(scope)} · ${reason}`);
}
async function submitRestriction() {
  const memo = $('rNote').value.trim();
  const ok = await addRestriction(rform.scope, rform.reason + (memo ? ' - ' + memo : ''), rform.dur);
  if (ok) { rform.reason = null; if ($('rNote')) $('rNote').value = ''; renderDetail(); }
}
async function clearRestriction(rid, quiet) {
  return restrictCall(`/api/hospitals/${encodeURIComponent(hid)}/restrictions/${rid}`, { method: 'DELETE' },
    quiet || '수용 제한을 해제했습니다.');
}
async function extendRestriction(rid) {
  // 서버에 수정 API가 없어서, 같은 범위·사유로 새로 등록한 뒤 기존 건을 해제
  const r = (hospitalInfo?.restrictions || []).find((x) => String(x.id) === String(rid));
  if (!r) return;
  if (await addRestriction(r.scope, r.reason, 3600)) await clearRestriction(rid, '수용 제한을 1시간 연장했습니다.');
}

// ---------------------------------------------------------------- 자원 수정 (치료 중 수)
function renderResourceDetail() {
  const r = (hospitalInfo?.resources || []).find((x) => x.resource_type === selectedRtype);
  if (!r) { $('detail').innerHTML = '<div class="empty">자원 정보를 불러오는 중입니다.</div>'; return; }
  if (draftOccupied === null) draftOccupied = r.occupied;
  const dis = busy ? 'disabled' : '';
  const free = r.capacity - draftOccupied - r.expected;
  const changed = draftOccupied !== r.occupied;
  const name = RESOURCE[r.resource_type] || r.resource_type;
  $('detail').innerHTML = `<div class="panel">
    <div class="panel-head"><div><div class="sub">우리 병원 자원 · 마지막 갱신 ${esc(kst(r.updated_at))}${r.stale ? ' · 오래된 정보' : ''}</div>
      <h3>${esc(name)} 치료 중 수 수정</h3></div></div>
    <div class="grid">
      <div class="field"><div class="k">전체</div><div class="v">${r.capacity}</div></div>
      <div class="field"><div class="k">도착 예정 (서버 자동 계산)</div><div class="v">${r.expected}</div></div>
      <div class="field"><div class="k">치료 중</div>
        <div class="v stepper">
          <button type="button" data-occ="-1" aria-label="치료 중 줄이기" ${dis}>−</button>
          <output>${draftOccupied}</output>
          <button type="button" data-occ="1" aria-label="치료 중 늘리기" ${dis}>+</button>
          ${changed ? `<span class="note">현재 ${r.occupied}</span>` : ''}
        </div></div>
      <div class="field"><div class="k">저장하면 남는 자리</div>
        <div class="v" style="font-size:20px;font-weight:700;color:${free < 0 ? 'var(--red)' : free === 0 ? 'var(--orange)' : 'inherit'}">${free < 0 ? '초과 ' + (-free) : free}</div></div>
      <div class="guide">환자가 퇴실하거나 직접 내원 환자가 나가서 자리가 비면 치료 중 수를 줄이세요. 줄이면 자리 부족 표시가 풀릴 수 있습니다.</div>
    </div>
    <div class="actions"><div class="row">
      <button type="button" class="btn btn-keep" id="resSave" ${dis || (changed ? '' : 'disabled')}>저장</button>
      <button type="button" class="btn-sub" id="resReset" ${dis || (changed ? '' : 'disabled')}>되돌리기</button>
    </div></div>
  </div>`;
}

async function saveResource() {
  const handler = needHandler(); if (!handler) return;
  const r = (hospitalInfo?.resources || []).find((x) => x.resource_type === selectedRtype);
  if (!r) return;
  busy = true; renderDetail();
  try {
    await api(`/api/hospitals/${encodeURIComponent(hid)}/resources/${encodeURIComponent(r.resource_type)}`, {
      method: 'PUT',
      body: JSON.stringify({ capacity: r.capacity, occupied: draftOccupied, status: r.status, handled_by: handler, expected_version: r.version }),
    });
    notice(`${RESOURCE[r.resource_type] || r.resource_type} 치료 중 수를 ${draftOccupied}(으)로 저장했습니다.`, false);
  } catch (e) {
    notice(e.body?.error === 'CONFLICT' ? '다른 담당자가 먼저 자원을 바꿨습니다. 최신 값으로 다시 불러왔으니 다시 입력하세요.' : e.message, true);
  } finally {
    draftOccupied = null; busy = false;
    resSig = ''; await loadResources(); lastSig = ''; await poll();
    renderDetail();
  }
}

// ---------------------------------------------------------------- 병원 처리 요청 공통
function needHandler() {
  const handler = $('handler').value.trim();
  if (!handler) { notice('담당자 이름을 먼저 입력하세요.', true); $('handler').focus(); }
  return handler;
}
async function hospitalAction(path, body, okMsg) {
  busy = true; renderDetail();
  try {
    const r = await api(path, { method: 'POST', body: JSON.stringify(body) });
    notice(okMsg, false);
    return r;
  } catch (e) {
    notice(e.message, true);
    return null;
  } finally {
    busy = false; lastSig = ''; await poll(); loadResources();
  }
}
async function patientAction(act) {
  const handler = needHandler(); if (!handler) return;
  const p = incomingData.incoming.find((x) => x.id === selectedPid); if (!p) return;
  const base = `/api/hospitals/${encodeURIComponent(hid)}/patients/${encodeURIComponent(p.id)}`;
  if (act === 'keep' || act === 'adjust') {
    const memo = $('adjustNote')?.value.trim();
    const note = act === 'adjust' ? adjustReason + (memo ? ' - ' + memo : '') : (memo || null);
    const r = await hospitalAction(`${base}/decision`, { decision: act, note, handled_by: handler },
      act === 'keep' ? '기존 수용을 유지한다고 구급대에 알렸습니다.' : `조정 필요(${note})를 구급대에 알렸습니다.`);
    if (r) adjustReason = null;
  } else if (act === 'arrive') {
    await hospitalAction(`${base}/arrive`, { handled_by: handler }, '도착을 확인했습니다. 자원이 치료 중으로 바뀌었습니다.');
  } else if (act === 'no-show') {
    await hospitalAction(`${base}/no-show`, { reason: '미도착', handled_by: handler }, '미도착으로 처리했습니다.');
  } else if (act === 'discharge') {
    await hospitalAction(`${base}/discharge`, { handled_by: handler }, '퇴실 처리했습니다. 자원이 비워졌습니다.');
  }
}
async function submitExternal() {
  const handler = needHandler(); if (!handler) return;
  const demandsBody = {};
  if (ext.ed_bed) demandsBody.ed_bed = ext.ed_bed;
  if (ext.special_team) demandsBody.special_team = ext.special_team;
  const note = $('extNote').value.trim() || null;
  const r = await hospitalAction(`/api/hospitals/${encodeURIComponent(hid)}/external-arrivals`,
    { resource_demands: demandsBody, note, handled_by: handler }, '직접 내원 환자를 등록했습니다.');
  if (r && r.affected.length) {
    // 영향받은 환자가 있으면 바로 그 환자 상세로 이동
    view = 'patient'; selectedPid = r.affected[0].patient.id;
    notice(`직접 내원 환자를 등록했습니다. 자리가 부족해진 도착 예정 환자 ${r.affected.length}명을 확인하세요.`, true);
    render();
  }
}

// ---------------------------------------------------------------- 시연용: 이송 중 환자 만들기
// 환자 앱이 할 일(생성 → 문의 → 확정 → 출발)과 병원의 수용 응답을 API로 한 번에 처리
async function createDemoTransport() {
  const btn = $('demoTransportBtn');
  btn.disabled = true;
  try {
    const caps = new Set(hospitalInfo?.capabilities || []);
    const fit = DEMO_CASES.filter((c) => c.required_capabilities.every((x) => caps.has(x)));
    const pool = fit.length ? fit : DEMO_CASES.slice(-1);
    const pick = pool[Math.floor(Math.random() * pool.length)];
    const pid = 'SIM-' + Date.now().toString(36).toUpperCase();
    const lat = (hospitalInfo?.lat ?? 35.15) + 0.03, lon = (hospitalInfo?.lon ?? 126.85) + 0.02;   // 병원에서 조금 떨어진 출발 위치
    await api('/api/patients', { method: 'POST', body: JSON.stringify({
      id: pid, reporter_role: 'transporter', consent: true, contact: '010-0000-0000',
      age: pick.age, symptoms: pick.symptoms, onset_at: Math.floor(Date.now() / 1000) - 1200,
      required_capabilities: pick.required_capabilities, resource_demands: pick.resource_demands,
      danger_signs: pick.danger_signs, priority: pick.priority, priority_source: 'expert', lat, lon,
    }) });
    const pv = await api(`/api/patients/${pid}/inquiries`, { method: 'POST', body: JSON.stringify({ hospital_ids: [hid] }) });
    const q = pv.inquiries.find((x) => x.hospital_id === hid);
    await api(`/api/inquiries/${q.id}/respond`, { method: 'POST', body: JSON.stringify({ action: 'accept', handled_by: '시연', expected_version: q.version }) });
    await api(`/api/patients/${pid}/confirm`, { method: 'POST', body: JSON.stringify({ inquiry_id: q.id }) });
    await api(`/api/patients/${pid}/depart`, { method: 'POST', body: JSON.stringify({ lat, lon }) });
    notice(`이송 중 환자를 만들었습니다: ${pick.age}세 · ${pick.symptoms}`, false);
    lastSig = '';
    await poll();
  } catch (e) {
    notice('이송 중 환자를 만들지 못했습니다: ' + e.message, true);
  } finally {
    btn.disabled = false;
  }
}

// ---------------------------------------------------------------- 이벤트
$('incomingList').addEventListener('click', (e) => {
  const card = e.target.closest('[data-pid]');
  if (!card) return;
  view = 'patient'; selectedPid = card.dataset.pid; adjustReason = null; notice('', false); render();
});
$('externalBtn').addEventListener('click', () => { view = 'external'; notice('', false); render(); });
$('resourceBar').addEventListener('click', (e) => {
  if (e.target.closest('#restrBtn')) { view = 'restrict'; notice('', false); render(); return; }
  const b = e.target.closest('[data-rtype]');
  if (!b) return;
  view = 'resource'; selectedRtype = b.dataset.rtype; draftOccupied = null; notice('', false);
  resSig = ''; loadResources(); render();
});
$('demoTransportBtn').addEventListener('click', createDemoTransport);
// 시연 메뉴: 버튼을 누르면 메뉴를 닫음
for (const id of ['demoBtn', 'demoTransportBtn']) $(id).addEventListener('click', () => { document.querySelector('.demo-menu').open = false; });
$('openList').addEventListener('click', (e) => {
  const card = e.target.closest('[data-id]');
  if (!card) return;
  view = 'inquiry'; selectedId = Number(card.dataset.id); declineReason = null; notice('', false); render();
});
$('detail').addEventListener('click', (e) => {
  // 도착 예정 환자 상세
  const adj = e.target.closest('[data-adj]');
  if (adj) { adjustReason = adj.dataset.adj; renderDetail(); return; }
  const pact = e.target.closest('[data-pact]');
  if (pact) { patientAction(pact.dataset.pact); return; }
  // 문의 상세의 경고에서 바로 이동
  const op = e.target.closest('[data-open]');
  if (op) {
    if (op.dataset.open === 'restrict') view = 'restrict';
    else { const q = current(); view = 'resource'; selectedRtype = acceptBlock(q.patient)?.rtype || 'ed_bed'; draftOccupied = null; }
    notice('', false); resSig = ''; loadResources(); render(); return;
  }
  // 수용 제한
  const rsc = e.target.closest('[data-rscope]'); if (rsc) { rform.scope = rsc.dataset.rscope; renderDetail(); return; }
  const rre = e.target.closest('[data-rreason]'); if (rre) { rform.reason = rre.dataset.rreason; renderDetail(); return; }
  const rdu = e.target.closest('[data-rdur]'); if (rdu) { rform.dur = rdu.dataset.rdur ? Number(rdu.dataset.rdur) : null; renderDetail(); return; }
  if (e.target.closest('#rSubmit')) { submitRestriction(); return; }
  const rcl = e.target.closest('[data-rclear]'); if (rcl) { clearRestriction(rcl.dataset.rclear); return; }
  const rex = e.target.closest('[data-rext]'); if (rex) { extendRestriction(rex.dataset.rext); return; }
  // 자원 수정
  const occ = e.target.closest('[data-occ]');
  if (occ) { draftOccupied = Math.max(0, draftOccupied + Number(occ.dataset.occ)); renderDetail(); return; }
  if (e.target.closest('#resSave')) { saveResource(); return; }
  if (e.target.closest('#resReset')) { draftOccupied = null; renderDetail(); return; }
  // 직접 내원 등록
  const st = e.target.closest('[data-step]');
  if (st) { const k = st.dataset.step; ext[k] = Math.max(0, Math.min(5, ext[k] + Number(st.dataset.d))); renderDetail(); return; }
  if (e.target.closest('#extSubmit')) { submitExternal(); return; }
  // 수용 문의 상세 (기존)
  const chip = e.target.closest('[data-reason]');
  if (chip) { declineReason = chip.dataset.reason; renderDetail(); return; }
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const act = btn.dataset.act;
  if (act === 'decline') respond('decline', { reason: declineReason });
  else if (act === 'question') {
    const text = $('questionInput').value.trim();
    if (!text) { notice('질문 내용을 입력하세요.', true); return; }
    respond('question', { question: text });
  } else respond(act);
});
$('hospital').addEventListener('change', () => {
  hid = $('hospital').value; store.set('hid', hid);
  selectedId = null; selectedPid = null; view = 'inquiry'; resSig = '';
  seen.clear(); newUntil.clear(); firstLoad = true; lastSig = ''; poll();
});
$('handler').addEventListener('change', () => store.set('handler', $('handler').value.trim()));
$('demoBtn').addEventListener('click', createDemoInquiry);
$('server').addEventListener('change', () => {
  serverBase = $('server').value.trim().replace(/\/$/, ''); store.set('serverBase', serverBase);
  loadHospitals().then(poll);
});

// 경과시간은 화면 전체를 다시 그리지 않고 글자만 1초마다 갱신 (클릭이 끊기지 않도록)
setInterval(() => {
  for (const el of document.querySelectorAll('[data-elapsed]')) {
    const q = data.open.find((x) => x.id === Number(el.dataset.elapsed)) || data.recent.find((x) => x.id === Number(el.dataset.elapsed));
    if (q) el.textContent = elapsed(q);
  }
  for (const el of document.querySelectorAll('[data-eta]')) {
    const p = incomingData.incoming.find((x) => x.id === el.dataset.eta);
    if (p) el.textContent = etaText(p);
  }
  for (const [id, until] of newUntil) if (until <= Date.now()) { newUntil.delete(id); render(); }
}, 1000);

loadHospitals().then(() => { poll(); setInterval(poll, POLL_MS); });
</script>
</body>
</html>
