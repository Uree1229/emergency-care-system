<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>환자 등록</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background-color: #f2f4f7;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 30px;
            background-color: white;
            border-radius: 15px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            background-color: #1976d2;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1565c0;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>환자 등록</h1>

        <!-- ⭐ 환자 정보를 서버로 보내는 부분 -->
        <form action="/register" method="post">

            <div class="form-group">
                <label for="name">이름</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="이름을 입력하세요"
                    required
                >
            </div>

            <div class="form-group">
                <label for="birth">생년월일</label>
                <input
                    type="date"
                    id="birth"
                    name="birth"
                >
            </div>

            <div class="form-group">
                <label for="phone">전화번호</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="010-0000-0000"
                >
            </div>

            <div class="form-group">
                <label for="address">주소</label>
                <input
                    type="text"
                    id="address"
                    name="address"
                    placeholder="주소를 입력하세요"
                >
            </div>

            <div class="form-group">
                <label for="guardian">보호자 이름</label>
                <input
                    type="text"
                    id="guardian"
                    name="guardian"
                    placeholder="보호자 이름"
                >
            </div>

            <div class="form-group">
                <label for="guardian_phone">보호자 전화번호</label>
                <input
                    type="tel"
                    id="guardian_phone"
                    name="guardian_phone"
                    placeholder="010-0000-0000"
                >
            </div>

            <button type="submit">환자 등록</button>

        </form>

    </div>

</body>
</html>
