<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>환자 등록 | 퀵119</title></head><body><main class="med-form"><a href="/" class="med-back">← 홈으로</a><section class="med-form-card"><span style="color:#2463a6;font-weight:800;font-size:12px">PATIENT PROFILE</span><h1>환자 정보 등록</h1><p style="color:#62748b;font-size:14px">응급상황 접수 시 사용할 정보를 입력해 주세요. 이름은 필수입니다.</p><form action="/register" method="post"><div class="med-form-grid"><div class="med-field"><label for="name">환자 이름 *</label><input id="name" name="name" required autocomplete="name" placeholder="이름"></div><div class="med-field"><label for="birth">생년월일</label><input id="birth" name="birth" placeholder="예: 1999-01-01"></div><div class="med-field"><label for="phone">연락처</label><input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="010-0000-0000"></div><div class="med-field"><label for="address">주소</label><input id="address" name="address" autocomplete="street-address" placeholder="거주지 주소"></div><div class="med-field"><label for="guardian">보호자 이름</label><input id="guardian" name="guardian" placeholder="보호자 이름"></div><div class="med-field"><label for="guardian_phone">보호자 연락처</label><input id="guardian_phone" name="guardian_phone" type="tel" placeholder="010-0000-0000"></div></div><button type="submit">환자 등록하기 →</button></form></section></main></body></html>
