<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>응급환자 지원 시스템</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f4f7;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 500px;

            background-color: white;

            padding: 40px 30px;

            border-radius: 20px;

            text-align: center;
        }

        .icon {
            font-size: 70px;
            margin-bottom: 20px;
        }

        h1 {
            margin-bottom: 15px;
        }

        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        .emergency-button {
            display: block;

            width: 100%;

            padding: 20px;

            background-color: #d32f2f;

            color: white;

            text-decoration: none;

            border-radius: 12px;

            font-size: 20px;

            font-weight: bold;
        }

        .emergency-button:hover {
            background-color: #b71c1c;
        }

    </style>

</head>


<body>

    <div class="container">

        <div class="icon">
            🚑
        </div>

        <h1>
            응급환자 지원
        </h1>

        <p>
            환자의 상태를 간단하게 확인하고<br>
            응급상황에 필요한 정보를 준비합니다.
        </p>

        <a
            href="/emergency"
            class="emergency-button"
        >
            🚨 응급상황 시작
        </a>

    </div>

</body>

</html>
